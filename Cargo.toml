[workspace]
resolver = "3"
members = ["backend", "common", "database", "dist", "frontend"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
jamery-backend.path = "./backend"
jamery-common.path = "./common"
jamery-database.path = "./database"
jamery-frontend.path = "./frontend"

axum = { version = "0.8.9", features = ["macros", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
leptos = { version = "0.8.22", features = ["csr"] }
leptos_router = "0.8.17"
sea-orm = { version = "2.0.4", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
] }
sea-orm-migration = "2.0.4"
tokio = { version = "1.54.0", features = ["full"] }
rust-embed = "8.13.0"
mime_guess = "2.0.5"
anyhow = "1.0.104"
url = "2.5.8"
gloo-net = "0.7.0"
web-sys = "0.3.106"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
dotenv = "0.15.0"
reqwest = { version = "0.13.5", features = ["json", "form"] }
pawkit-interner = "0.1.25"
base64 = "0.23.1"
sha2 = "0.11.1"
getrandom = "0.4.3"
opendal = { version = "0.59.5", features = ["services-fs"] }
ulid = { version = "3.0.0", features = ["serde"] }
